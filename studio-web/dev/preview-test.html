<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Preview test</title><style>body{margin:0;background:#0b0b0d;color:#eee;font:14px system-ui}#p{max-width:380px;margin:12px auto}#log{max-width:380px;margin:8px auto;white-space:pre-wrap;font-size:12px;color:#9a98a3}</style></head>
<body><div id="p"></div><div id="log"></div>
<script src="/preview.js"></script>
<script>
(async () => {
  const log = (m) => (document.getElementById("log").textContent += m + "\n");
  try {
    const props = await (await fetch("/dev-props.json")).json();
    // every media path the job references -> local URL (in production: presigned Blob links)
    const map = {}, walk = (o) => { if (typeof o === "string") { if (/\.(jpe?g|png|webp|mp4|wav|mp3|m4a)$/i.test(o) && !/^https?:/.test(o)) map[o.replace(/^\/+/, "")] = "/studio-public/" + o.replace(/^\/+/, ""); } else if (o && typeof o === "object") Object.values(o).forEach(walk); };
    walk(props.job);
    const t0 = performance.now();
    window.P = StudioPreview.mount(document.getElementById("p"), props, map);
    log(`mounted in ${(performance.now() - t0).toFixed(0)} ms · ${props.job.beats.length} scenes · ${P.duration().toFixed(1)} s · ${Object.keys(map).length} media files mapped`);
  } catch (e) { log("ERROR " + e.stack); }
})();
</script></body></html>
