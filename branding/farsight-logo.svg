<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Farsight">
  <rect width="512" height="512" rx="104" fill="#0A0A0B"/>
  <!-- distant point being sighted (the long-term target) -->
  <g fill="#10B981">
    <path d="M372 128 l8 20 20 8 -20 8 -8 20 -8 -20 -20 -8 20 -8 z"/>
  </g>
  <!-- spyglass / telescope: seeing far ahead -->
  <g transform="rotate(-30 256 210)" stroke="#10B981" fill="none"
     stroke-width="10" stroke-linejoin="round" stroke-linecap="round">
    <!-- tube, tapering wider toward the objective (right) -->
    <path d="M182 190 L330 176 L330 244 L182 230 Z"/>
    <!-- eyepiece cap -->
    <path d="M164 197 L182 190 L182 230 L164 223 Z" fill="#10B981"/>
    <!-- objective lens ring -->
    <line x1="330" y1="168" x2="330" y2="252"/>
  </g>
  <!-- wordmark -->
  <text x="256" y="416" text-anchor="middle" font-family="Inter, Montserrat, Arial, sans-serif"
        font-size="56" font-weight="800" letter-spacing="8" fill="#FFFFFF">FARSIGHT</text>
  <text x="256" y="450" text-anchor="middle" font-family="Inter, Arial, sans-serif"
        font-size="18" font-weight="500" letter-spacing="6" fill="#9AA3AD">MONEY, HONESTLY</text>
</svg>
