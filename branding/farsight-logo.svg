<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Farsight">
  <rect width="512" height="512" rx="104" fill="#0A0A0B"/>
  <!-- sight line / horizon -->
  <line x1="118" y1="196" x2="394" y2="196" stroke="#10B981" stroke-width="2.5" opacity="0.35"/>
  <!-- eye: two arcs forming an almond -->
  <g fill="none" stroke="#10B981" stroke-width="8" stroke-linecap="round">
    <path d="M150 196 Q256 120 362 196"/>
    <path d="M150 196 Q256 272 362 196"/>
  </g>
  <!-- iris + pupil -->
  <circle cx="256" cy="196" r="40" fill="none" stroke="#10B981" stroke-width="8"/>
  <circle cx="256" cy="196" r="15" fill="#10B981"/>
  <!-- far marker on the horizon -->
  <circle cx="360" cy="196" r="5.5" fill="#10B981"/>
  <!-- wordmark -->
  <text x="256" y="414" text-anchor="middle" font-family="Inter, Montserrat, Arial, sans-serif"
        font-size="56" font-weight="800" letter-spacing="8" fill="#FFFFFF">FARSIGHT</text>
  <text x="256" y="448" text-anchor="middle" font-family="Inter, Arial, sans-serif"
        font-size="18" font-weight="500" letter-spacing="6" fill="#9AA3AD">MONEY, HONESTLY</text>
</svg>
