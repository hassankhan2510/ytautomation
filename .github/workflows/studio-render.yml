name: "Studio — Render Reel"

# Renders one Instagram reel (1080x1920) from a beat sheet in studio/ and hands back the MP4 as a
# downloadable artifact. Nothing is posted anywhere. Isolated from every other pipeline.
on:
  workflow_dispatch:
    inputs:
      job:
        description: "Beat-sheet file inside studio/ (default = the Day 1 hero)"
        required: false
        default: "src/data/job.json"
        type: string
      theme:
        description: "Theme override"
        type: choice
        options: [job, crimson, ocean, grape, sunrise, lagoon, mango, mint, neon, acid, electric, paper, taxi]
        default: job
      seed:
        description: "Variation seed (blank = job's seed). Same script + new seed = a different edit."
        required: false
        type: string
      shaders:
        description: "Real GPU shader cuts: off = fast CSS cuts incl. echo zoom-blur (~4 min) · on = WebGL shader cuts (~18 min on CPU runners)"
        type: choice
        options: ["off", "on"]
        default: "off"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install headless-Chrome libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libgbm1 \
            libasound2t64 libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 \
            libpango-1.0-0 libcairo2 libcups2 fonts-liberation fonts-noto-color-emoji
      - run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
      - name: Build props
        env:
          THEME: ${{ github.event.inputs.theme }}
          SEED: ${{ github.event.inputs.seed }}
          SHADERS: ${{ github.event.inputs.shaders }}
          JOB_FILE: ${{ github.event.inputs.job || 'src/data/job.json' }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          GROQ_FALLBACK_MODEL: ${{ vars.GROQ_FALLBACK_MODEL }}
        run: node scripts/props.mjs "$JOB_FILE" out/props.json
      - name: Render (shader path, falls back to CSS path on failure)
        run: |
          if npx remotion render Reel out/reel.mp4 --props=out/props.json --concurrency=2 --gl=swangle --log=info; then
            echo "Rendered."
            echo "Rendered on the **shader** path (swangle WebGL2)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Shader path failed → rendered on the **CSS** path." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Render failed with shaders — retrying on the CSS-only path."
            node -e "const f='out/props.json';const p=JSON.parse(require('fs').readFileSync(f));p.shaders=false;require('fs').writeFileSync(f,JSON.stringify(p))"
            npx remotion render Reel out/reel.mp4 --props=out/props.json --concurrency=2 --log=info
          fi
      - name: Poster frame
        run: npx remotion still Reel out/poster.jpg --props=out/props.json --frame=20 || true
      - name: Deliver as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: studio-reel-run${{ github.run_number }}
          path: |
            studio/out/reel.mp4
            studio/out/poster.jpg
            studio/out/props.json
          retention-days: 30
          if-no-files-found: warn
