name: "Syndar — Weekly (auto: 1 long + 2 shorts, Sat)"

# Fully autonomous: the scout picks a trending deep-tech / physical-AI topic, the machine builds ONE
# long + TWO shorts in YOUR cloned voice and uploads all as PRIVATE for review. Runs once a week (Sat)
# = 1 long + 2 shorts/week. Blank topic on manual runs = auto-pick.
on:
  schedule:
    - cron: "0 23 * * 6" # Saturday ~18:00 US-Eastern — tech/dev audience most active in the evening
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional topic (leave blank to auto-pick a trending one)"
        required: false
        type: string

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    defaults:
      run:
        working-directory: theranos-doc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: theranos-doc/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install headless-Chrome libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libgbm1 \
            libasound2t64 libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 \
            libpango-1.0-0 libcairo2 libcups2 fonts-liberation fonts-noto-color-emoji espeak-ng
      - run: npm ci
      - run: pip install edge-tts soundfile chatterbox-tts peft resemble-perth
      - name: Pick a trending topic (scout)
        id: scout
        run: |
          TOPIC="${{ github.event.inputs.topic }}"
          if [ -z "$TOPIC" ]; then TOPIC="$(node scripts/scout.mjs --channel=syndar --one)"; fi
          echo "Chosen topic: $TOPIC"
          echo "topic=$TOPIC" >> "$GITHUB_OUTPUT"
      - name: Write long + shorts (Groq)
        env:
          CHANNEL: syndar
          TOPICS: ${{ steps.scout.outputs.topic }}
          MODE: long+shorts
          SHORTS: "2"
          LANGUAGE: English
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          GROQ_FALLBACK_MODEL: ${{ vars.GROQ_FALLBACK_MODEL }}
          GROQ_TPM: ${{ vars.GROQ_TPM }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: node scripts/generate_script.mjs
      - name: Persist topic history (so tomorrow won't repeat)
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add channels/history/*.json 2>/dev/null || true
          git commit -m "chore(history): syndar daily topic [skip ci]" || { echo "no history change"; exit 0; }
          git pull --rebase --autostash || true
          git push || echo "push skipped"
      - name: Cross-post this week's topic to LinkedIn via Buffer (no-op without token)
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_CHANNEL_ID_SYNDAR: ${{ vars.BUFFER_CHANNEL_ID_SYNDAR }}
        run: node scripts/buffer_post.mjs --channel=syndar --script=jobs/syndar.json
      - name: Render (your cloned voice) + upload to YouTube (private) + LinkedIn (if enabled)
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          VOICE: myvoice
          UPLOAD: "1"
          YT_PRIVACY: private
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN_SYNDAR: ${{ secrets.YT_REFRESH_TOKEN_SYNDAR }}
          # LinkedIn Page auto-post — off unless you set the repo variable LI_UPLOAD=1 and add the secrets.
          LI_UPLOAD: ${{ vars.LI_UPLOAD }}
          LI_TYPE: ${{ vars.LI_TYPE }}
          LI_ACCESS_TOKEN: ${{ secrets.LI_ACCESS_TOKEN }}
          LI_CLIENT_ID: ${{ secrets.LI_CLIENT_ID }}
          LI_CLIENT_SECRET: ${{ secrets.LI_CLIENT_SECRET }}
          LI_REFRESH_TOKEN: ${{ secrets.LI_REFRESH_TOKEN }}
          LI_ORG_URN_SYNDAR: ${{ secrets.LI_ORG_URN_SYNDAR }}
        run: npm run batch -- --only=syndar
      - name: Deliver as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: syndar-daily-run${{ github.run_number }}
          path: theranos-doc/out/syndar*.zip
          retention-days: 30
          if-no-files-found: warn
