name: "Channel — TIL (PAUSED — manual only)"

# Groq invents a valuable fact, the machine builds a short, and it lands in out/til/.
# NOTE: TIL is PAUSED — no scheduled auto-run (see below). It only runs if you trigger it by hand
# from the Actions tab. Re-enable the daily cron when you want TIL back.
on:
  workflow_dispatch:
    inputs:
      topics:
        description: "Optional — ONE video each. Separate with ;  (leave blank to let the AI pick a fact)"
        required: false
        type: string
      format:
        description: "What to make (TIL is a short by default; pick long for a deep-dive)"
        required: true
        default: "shorts"
        type: choice
        options:
          - "shorts"
          - "long"
          - "long+shorts"
      language:
        description: "Language"
        required: true
        default: "English"
        type: choice
        options:
          - "English"
          - "Urdish"
          - "Hinglish"
      voice:
        description: "Voice"
        required: true
        default: "Auto (natural — Kokoro + edge-tts)"
        type: choice
        options:
          - "Auto (natural — Kokoro + edge-tts)"
          - "My voice (Chatterbox clone)"
          - "Edge-tts (robotic, fastest)"
      upload:
        description: "Upload to YouTube? (needs a TIL token added; No = just make the video + kit)"
        required: true
        default: "No"
        type: choice
        options:
          - "Yes"
          - "No"
  # Daily auto-run DISABLED — TIL isn't fully set up yet. Run it manually from the Actions tab.
  # (Re-enable later by uncommenting:)
  #  schedule:
  #    - cron: "0 3 * * *"

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    defaults:
      run:
        working-directory: theranos-doc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: theranos-doc/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install headless-Chrome libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libgbm1 \
            libasound2t64 libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 \
            libpango-1.0-0 libcairo2 libcups2 fonts-liberation fonts-noto-color-emoji espeak-ng
      - run: npm ci
      - run: pip install edge-tts
      - name: Install Kokoro (only for the natural "Auto" English voice)
        if: ${{ !contains(github.event.inputs.voice, 'My voice') && !contains(github.event.inputs.voice, 'Edge') }}
        run: pip install kokoro soundfile
      - name: Install voice-clone deps (only when "My voice" is selected)
        if: contains(github.event.inputs.voice, 'My voice')
        run: pip install chatterbox-tts peft resemble-perth
      - name: Write script (Groq)
        env:
          CHANNEL: til
          TOPICS: ${{ github.event.inputs.topics }}
          MODE: ${{ github.event.inputs.format }}
          LANGUAGE: ${{ github.event.inputs.language }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          GROQ_FALLBACK_MODEL: ${{ vars.GROQ_FALLBACK_MODEL }}
          GROQ_TPM: ${{ vars.GROQ_TPM }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: node scripts/generate_script.mjs
      - name: Render (+ optional upload)
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          VOICE_CHOICE: ${{ github.event.inputs.voice }}
          UPLOAD: ${{ github.event.inputs.upload == 'Yes' && '1' || '0' }}
          YT_PRIVACY: public
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN_TIL: ${{ secrets.YT_REFRESH_TOKEN_TIL }}
        run: |
          case "$VOICE_CHOICE" in
            *"My voice"*) export VOICE=myvoice ;;
            *"Edge"*)     export VOICE=edge ;;
            *)            export VOICE=auto ;;
          esac
          echo "Voice engine: $VOICE"
          npm run batch -- --only=til
      - name: Deliver as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: til-run${{ github.run_number }}
          path: theranos-doc/out/til*.zip
          retention-days: 30
          if-no-files-found: warn
