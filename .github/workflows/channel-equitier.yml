name: "Channel — Equitier (finance)"

on:
  workflow_dispatch:
    inputs:
      topics:
        description: "Topics — ONE video each. Separate multiple with ;  (e.g. 'How inflation steals your money; The truth about index funds; Why most traders lose')"
        required: true
        type: string
      format:
        description: "What to make"
        required: true
        default: "long+shorts"
        type: choice
        options:
          - "long+shorts"
          - "long"
          - "shorts"
      shorts_count:
        description: "How many shorts PER TOPIC (applies to shorts / long+shorts)"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
      language:
        description: "Language"
        required: true
        default: "English"
        type: choice
        options:
          - "English"
          - "Urdish"
          - "Hinglish"
      voice:
        description: "Voice"
        required: true
        default: "Auto (natural — Kokoro + edge-tts)"
        type: choice
        options:
          - "Auto (natural — Kokoro + edge-tts)"
          - "My voice (Chatterbox clone)"
          - "Edge-tts (robotic, fastest)"
      upload:
        description: "Upload to YouTube? (No = just make the video + kit)"
        required: true
        default: "Yes"
        type: choice
        options:
          - "Yes"
          - "No"

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    defaults:
      run:
        working-directory: theranos-doc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: theranos-doc/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install headless-Chrome libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libgbm1 \
            libasound2t64 libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 \
            libpango-1.0-0 libcairo2 libcups2 fonts-liberation fonts-noto-color-emoji espeak-ng
      - run: npm ci
      - run: pip install edge-tts
      - name: Install Kokoro (only for the natural "Auto" English voice)
        if: ${{ !contains(github.event.inputs.voice, 'My voice') && !contains(github.event.inputs.voice, 'Edge') }}
        run: pip install kokoro soundfile
      - name: Install voice-clone deps (only when "My voice" is selected)
        if: contains(github.event.inputs.voice, 'My voice')
        run: pip install chatterbox-tts peft resemble-perth
      - name: Write script + shorts (Groq, Wikipedia-grounded)
        env:
          CHANNEL: equitier
          TOPICS: ${{ github.event.inputs.topics }}
          MODE: ${{ github.event.inputs.format }}
          SHORTS: ${{ github.event.inputs.shorts_count }}
          LANGUAGE: ${{ github.event.inputs.language }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: node scripts/generate_script.mjs
      - name: Render long + shorts + upload to YouTube (private)
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          VOICE_CHOICE: ${{ github.event.inputs.voice }}
          UPLOAD: ${{ github.event.inputs.upload == 'No' && '0' || '1' }}
          YT_PRIVACY: private
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN_EQUITIER: ${{ secrets.YT_REFRESH_TOKEN_EQUITIER }}
        run: |
          case "$VOICE_CHOICE" in
            *"My voice"*) export VOICE=myvoice ;;
            *"Edge"*)     export VOICE=edge ;;
            *)            export VOICE=auto ;;
          esac
          echo "Voice engine: $VOICE"
          npm run batch -- --only=equitier
      - name: Deliver as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: equitier-run${{ github.run_number }}
          path: theranos-doc/out/equitier*.zip
          retention-days: 30
          if-no-files-found: warn
