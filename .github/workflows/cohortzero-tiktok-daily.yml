name: "Cohort Zero — TikTok Pakistan Daily (auto, trend-picked)"

# Daily Pakistan-focused founder/entrepreneurship short for TikTok. The topic scout picks a trending
# Pakistan startup/entrepreneur topic (cohortzero_pk seeds), the machine builds ONE 9:16 short in your
# cloned voice, and it's ATTEMPTED to be uploaded to TikTok via cookies. The video ALWAYS lands as a
# downloadable artifact so if TikTok auto-upload fails, you post it manually — nothing is lost.
#
# See docs/COHORTZERO_TIKTOK_PK.md for cookie setup + the honest risks (datacenter IP flagging, etc).
on:
  schedule:
    - cron: "30 15 * * *" # ~20:30 Pakistan Standard Time — TikTok PK peak evening scroll hour
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional topic (leave blank to auto-pick a Pakistan-founder trending one)"
        required: false
        type: string
      voice:
        description: "Voice"
        required: true
        default: "My voice (Chatterbox clone)"
        type: choice
        options:
          - "My voice (Chatterbox clone)"
          - "Auto (natural — Kokoro + edge-tts)"
          - "Edge-tts (robotic, fastest)"
      upload:
        description: "Attempt TikTok upload? (No = just make the video + kit)"
        required: true
        default: "Yes"
        type: choice
        options:
          - "Yes"
          - "No"

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    defaults:
      run:
        working-directory: theranos-doc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: theranos-doc/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install headless-Chrome libraries + Chrome (for TikTok upload)
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libgbm1 \
            libasound2t64 libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 \
            libpango-1.0-0 libcairo2 libcups2 fonts-liberation fonts-noto-color-emoji espeak-ng \
            chromium-browser chromium-chromedriver
      - run: npm ci
      - run: pip install edge-tts soundfile chatterbox-tts peft resemble-perth tiktok-uploader
      - name: Pick a trending Pakistan-founder topic (scout)
        id: scout
        run: |
          TOPIC="${{ github.event.inputs.topic }}"
          if [ -z "$TOPIC" ]; then TOPIC="$(node scripts/scout.mjs --channel=cohortzero_pk --one)"; fi
          echo "Chosen topic: $TOPIC"
          echo "topic=$TOPIC" >> "$GITHUB_OUTPUT"
      - name: Write short (Groq — Pakistan-flavoured Cohort Zero script)
        env:
          CHANNEL: cohortzero
          TOPICS: ${{ steps.scout.outputs.topic }}
          MODE: shorts
          SHORTS: "1"
          LANGUAGE: English # keep script English so on-screen text is universally readable; swap to Urdish later if desired
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: node scripts/generate_script.mjs
      - name: Render (your cloned voice) — NO YouTube upload for this workflow
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          VOICE_CHOICE: ${{ github.event.inputs.voice || 'My voice (Chatterbox clone)' }}
          UPLOAD: "0"
        run: |
          case "$VOICE_CHOICE" in
            *"My voice"*) export VOICE=myvoice ;;
            *"Edge"*)     export VOICE=edge ;;
            *)            export VOICE=auto ;;
          esac
          echo "Voice engine: $VOICE"
          npm run batch -- --only=cohortzero
      - name: Attempt TikTok upload (cookies + hashtag-optimised caption)
        if: ${{ github.event.inputs.upload != 'No' }}
        env:
          TIKTOK_COOKIES: ${{ secrets.TIKTOK_COOKIES_COHORTZERO }}
        run: |
          VIDEO=$(ls out/cohortzero_short_1_reel.mp4 out/cohortzero_short_1_*.mp4 2>/dev/null | head -n1 || true)
          TITLE=$(node -e "const j=require('./jobs/cohortzero_short_1.json');console.log((j.meta.title||'').slice(0,80))")
          if [ -z "$VIDEO" ] || [ ! -f "$VIDEO" ]; then
            echo "tiktok: no rendered short found — skipping upload."
            exit 0
          fi
          # TikTok favours punchy caption + 3-6 targeted hashtags at the end.
          DESC="$TITLE

          #entrepreneur #startup #pakistan #foundersjourney #businessmindset #karachi #lahore #islamabad #pakistanistartup #foundermindset #foryou #fyp"
          python scripts/tiktok_upload.py --video "$VIDEO" --description "$DESC" || true
      - name: Deliver as downloadable artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: cohortzero-tiktok-pk-run${{ github.run_number }}
          path: theranos-doc/out/cohortzero*.zip
          retention-days: 30
          if-no-files-found: warn
