name: "Cohort Zero — Daily One-Page Reels → Instagram"

# TWO single-card reels a day in the LinkedIn-personal CREATOR style (byline + one sharp idea + a
# relevant AI background), posted to Cohort Zero's Instagram feed AND Story:
#   morning  = LESSON  (an evergreen founder/VC lesson)
#   evening  = NEWS    (a founder-relevant take on TODAY's real startup news, RSS-picked, de-duped)
# Posts only if the Meta secrets for Cohort Zero are set (META_*_COHORTZERO); otherwise it renders the
# MP4 and hands it back as a downloadable artifact.
on:
  schedule:
    - cron: "0 10 * * *"  # morning — LESSON
    - cron: "0 15 * * *"  # afternoon — NEWS
    - cron: "40 18 * * *" # evening — QUOTE (shareable wisdom for the feed)
  workflow_dispatch:
    inputs:
      mode:
        description: "lesson = evergreen founder lesson · news = today's startup news · quote = shareable wisdom"
        type: choice
        options: [lesson, news, quote]
        default: lesson
        required: false
      topic:
        description: "Optional topic for LESSON mode (blank = auto-pick)"
        required: false
        type: string
      publish:
        description: "publish = post to Instagram · test = render only (download the artifact)"
        type: choice
        options: [publish, test]
        default: publish
        required: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        working-directory: theranos-doc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: theranos-doc/package-lock.json
      - name: Install headless-Chrome libraries (for the Remotion render)
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libgbm1 \
            libasound2t64 libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 \
            libpango-1.0-0 libcairo2 libcups2 fonts-liberation fonts-noto-color-emoji
      - run: npm ci
      - name: Decide mode (morning=lesson, evening=news; or manual input)
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "0 15 * * *")  MODE=news ;;
              "40 18 * * *") MODE=quote ;;
              *)             MODE=lesson ;;
            esac
          else
            MODE="${{ github.event.inputs.mode }}"; MODE="${MODE:-lesson}"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Mode: $MODE"
      - name: Pick a trending founder/VC topic (scout — LESSON mode only)
        id: scout
        if: steps.mode.outputs.mode == 'lesson'
        run: |
          TOPIC="${{ github.event.inputs.topic }}"
          if [ -z "$TOPIC" ]; then TOPIC="$(node scripts/scout.mjs --channel=cohortzero --one)"; fi
          echo "Chosen topic: $TOPIC"
          echo "topic=$TOPIC" >> "$GITHUB_OUTPUT"
      - name: Write the card (Groq, grounded, de-duped)
        env:
          CHANNEL: cohortzero
          ONEPAGER_MODE: ${{ steps.mode.outputs.mode }}
          TOPIC: ${{ steps.scout.outputs.topic }}
          ONEPAGER_AVATAR: ${{ vars.ONEPAGER_AVATAR_COHORTZERO }}
          ONEPAGER_NAME: ${{ vars.ONEPAGER_NAME_COHORTZERO }}
          ONEPAGER_AT: ${{ vars.ONEPAGER_AT_COHORTZERO }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          GROQ_FALLBACK_MODEL: ${{ vars.GROQ_FALLBACK_MODEL }}
          GROQ_TPM: ${{ vars.GROQ_TPM }}
        run: node scripts/gen_onepager.mjs
      - name: Persist topic history (so tomorrow won't repeat)
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add channels/history/*.json 2>/dev/null || true
          git commit -m "chore(history): cohortzero one-pager topic [skip ci]" || { echo "no history change"; exit 0; }
          git pull --rebase --autostash || true
          git push || echo "push skipped"
      - name: Stub timeline.json so the bundler resolves (it's gitignored; OnePager doesn't use it)
        run: |
          if [ ! -f src/data/timeline.json ]; then
            echo '{"fps":30,"totalDurationInFrames":1,"accentColor":"#e11d48"}' > src/data/timeline.json
            echo "wrote stub src/data/timeline.json"
          fi
      - name: Render the reel (OnePager, 9:16)
        run: npx remotion render OnePager out/cohortzero_onepager.mp4 --props=out/onepager_props.json --concurrency=2
      - name: Post to Instagram (no-op unless Meta secrets are set / test run)
        if: ${{ github.event.inputs.publish != 'test' }}
        env:
          META_TARGETS: "ig"
          META_STORY: "1"
          META_PAGE_ID_COHORTZERO: ${{ vars.META_PAGE_ID_COHORTZERO || secrets.META_PAGE_ID_COHORTZERO }}
          META_IG_USER_ID_COHORTZERO: ${{ vars.META_IG_USER_ID_COHORTZERO || secrets.META_IG_USER_ID_COHORTZERO }}
          META_PAGE_TOKEN_COHORTZERO: ${{ secrets.META_PAGE_TOKEN_COHORTZERO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/meta_upload.mjs --channel=cohortzero --video=out/cohortzero_onepager.mp4 --script=jobs/cohortzero_onepager.json
      - name: Render the 3-slide LinkedIn carousel (LESSON only = 1/day)
        if: ${{ github.event.inputs.publish != 'test' && steps.mode.outputs.mode == 'lesson' }}
        run: |
          i=0
          jq -c '.[]' out/li_slides.json | while read -r slide; do
            i=$((i+1))
            printf '%s' "$slide" > out/li_slide_props.json
            npx remotion still OnePagerLI "out/li_slide_0$i.png" --props=out/li_slide_props.json --frame=120
          done
      - name: Cross-post the carousel to LinkedIn via Buffer (no-op without token)
        if: ${{ github.event.inputs.publish != 'test' && steps.mode.outputs.mode == 'lesson' }}
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_CHANNEL_ID_COHORTZERO: ${{ vars.BUFFER_CHANNEL_ID_COHORTZERO }}
          BUFFER_DRAFT: ${{ vars.BUFFER_DRAFT }}
          BUFFER_MODE: ${{ vars.BUFFER_MODE }}
          BUFFER_SCHEDULING: ${{ vars.BUFFER_SCHEDULING }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/buffer_post.mjs --channel=cohortzero --props=out/onepager_props.json --script=jobs/cohortzero_onepager.json --imageglob=out/li_slide_*.png
      - name: Deliver as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: cohortzero-onepager-run${{ github.run_number }}
          path: |
            theranos-doc/out/cohortzero_onepager.mp4
            theranos-doc/out/onepager_props.json
          retention-days: 30
          if-no-files-found: warn
