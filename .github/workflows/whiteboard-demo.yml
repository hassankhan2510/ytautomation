name: "Whiteboard Explainer — Demo Render"

# Isolated 2.5D whiteboard-explainer spike (whiteboard/ folder). Renders an MP4 you download from the
# run's artifacts — nothing is posted anywhere. `sample` renders the committed sample scenes (silent,
# instant). `generate` writes a fresh AI script + Kokoro voice for your topic, then renders.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "sample = render committed sample (fast) · generate = AI script + voice from your topic"
        type: choice
        options: [sample, generate]
        default: sample
        required: false
      topic:
        description: "Topic (generate mode)"
        required: false
        type: string
        default: "why most startups actually fail"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: whiteboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install headless-Chrome libraries + espeak
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libgbm1 \
            libasound2t64 libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 \
            libpango-1.0-0 libcairo2 libcups2 fonts-liberation fonts-noto-color-emoji espeak-ng
      - run: npm install
      - name: Generate AI script + Kokoro voice (generate mode only)
        if: ${{ github.event.inputs.mode == 'generate' }}
        env:
          TOPIC: ${{ github.event.inputs.topic }}
          BRAND: "COHORT ZERO"
          NICHE: "startup / founder"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          GROQ_TPM: ${{ vars.GROQ_TPM }}
        run: |
          pip install kokoro soundfile edge-tts
          node scripts/gen_scenes.mjs
          python scripts/voice.py
      - name: Render the explainer
        run: npx remotion render Whiteboard out/whiteboard.mp4 --concurrency=2
      - name: Upload the MP4
        uses: actions/upload-artifact@v4
        with:
          name: whiteboard-${{ github.event.inputs.mode }}-run${{ github.run_number }}
          path: whiteboard/out/whiteboard.mp4
          retention-days: 30
          if-no-files-found: warn
