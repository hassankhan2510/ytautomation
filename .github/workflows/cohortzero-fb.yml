name: "Cohort Zero — Daily Facebook Reels (Hinglish shorts)"

# TWO short videos a day for the Pakistani audience: business / how-to-start-a-startup content in
# HINGLISH (Hindi voice via Kokoro + English words + English on-screen captions), AI-generated visuals
# (Pollinations, free), a hard first-3-seconds hook. Posts to the Cohort Zero Facebook Page (Instagram stays the one-page reels).
on:
  # STOPPED: all Cohort Zero auto-posting paused (Facebook). Manual dispatch only; re-enable to resume.
  # schedule:
  #   - cron: "30 15 * * *" # ~20:30 PKT — Pakistan evening scroll
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional topic (blank = auto-pick a trending business/startup one)"
        required: false
        type: string
      publish:
        description: "publish = post to Facebook · test = render only (download the artifact)"
        type: choice
        options: [publish, test]
        default: publish
        required: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    permissions:
      contents: write
    defaults:
      run:
        working-directory: theranos-doc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: theranos-doc/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install headless-Chrome libraries + espeak (Kokoro Hindi g2p)
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libgbm1 \
            libasound2t64 libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 \
            libpango-1.0-0 libcairo2 libcups2 fonts-liberation fonts-noto-color-emoji espeak-ng
      - run: npm ci
      - run: pip install edge-tts soundfile kokoro
      - name: Random start delay (varies the post time daily — less bot-like to Meta)
        run: sleep $((RANDOM % 7200)) # 0–2h jitter
      - name: Pick a trending business/startup topic (scout)
        id: scout
        run: |
          TOPIC="${{ github.event.inputs.topic }}"
          if [ -z "$TOPIC" ]; then TOPIC="$(node scripts/scout.mjs --channel=cohortzero --one)"; fi
          echo "Chosen topic: $TOPIC"
          echo "topic=$TOPIC" >> "$GITHUB_OUTPUT"
      - name: Write 1 Hinglish short (Groq)
        env:
          CHANNEL: cohortzero
          TOPICS: ${{ steps.scout.outputs.topic }}
          MODE: shorts
          SHORTS: "1"
          LANGUAGE: Hinglish
          IG_TONE: "1"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          GROQ_FALLBACK_MODEL: ${{ vars.GROQ_FALLBACK_MODEL }}
          GROQ_TPM: ${{ vars.GROQ_TPM }}
        run: node scripts/generate_script.mjs
      - name: Persist topic history (no repeats)
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add channels/history/*.json 2>/dev/null || true
          git commit -m "chore(history): cohortzero fb reels [skip ci]" || { echo "no history change"; exit 0; }
          git pull --rebase --autostash || true
          git push || echo "push skipped"
      - name: Render (Kokoro Hindi voice + AI images) + post to Facebook
        env:
          VOICE: kokoro
          AI_IMAGES: "1"
          UPLOAD: "0" # not YouTube — Facebook/Instagram only
          META_UPLOAD: ${{ github.event.inputs.publish == 'test' && '0' || '1' }}
          META_TARGETS: "fb"
          META_PAGE_ID_COHORTZERO: ${{ vars.META_PAGE_ID_COHORTZERO || secrets.META_PAGE_ID_COHORTZERO }}
          META_IG_USER_ID_COHORTZERO: ${{ vars.META_IG_USER_ID_COHORTZERO || secrets.META_IG_USER_ID_COHORTZERO }}
          META_PAGE_TOKEN_COHORTZERO: ${{ secrets.META_PAGE_TOKEN_COHORTZERO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run batch -- --only=cohortzero
      - name: Deliver as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: cohortzero-fb-run${{ github.run_number }}
          path: theranos-doc/out/cohortzero*.zip
          retention-days: 30
          if-no-files-found: warn
