name: "Channel — Syndar (deep tech) [VERIFY before publishing]"

# NOTE: Syndar represents your startup's credibility. The machine DRAFTS the video; you must
# review the technical claims in the publish kit before uploading. Grounded via Wikipedia, but
# deep-tech accuracy still needs a human eye.
on:
  workflow_dispatch:
    inputs:
      topics:
        description: "Topics — ONE video each. Separate multiple with ;  (e.g. 'Why cameras fail in the dark; How radar sees through dust; SLAM in GPS-denied mines')"
        required: true
        type: string
      format:
        description: "What to make"
        required: true
        default: "long+shorts"
        type: choice
        options:
          - "long+shorts"
          - "long"
          - "shorts"
      shorts_count:
        description: "How many shorts PER TOPIC (applies to shorts / long+shorts)"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
      language:
        description: "Language"
        required: true
        default: "English"
        type: choice
        options:
          - "English"
          - "Urdish"
          - "Hinglish"
      voice:
        description: "Voice"
        required: true
        default: "Auto (natural — Kokoro + edge-tts)"
        type: choice
        options:
          - "Auto (natural — Kokoro + edge-tts)"
          - "My voice (Chatterbox clone)"
          - "Edge-tts (robotic, fastest)"

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    defaults:
      run:
        working-directory: theranos-doc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: theranos-doc/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install headless-Chrome libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libgbm1 \
            libasound2t64 libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 \
            libpango-1.0-0 libcairo2 libcups2 fonts-liberation fonts-noto-color-emoji espeak-ng
      - run: npm ci
      - run: pip install edge-tts
      - name: Install Kokoro (only for the natural "Auto" English voice)
        if: ${{ !contains(github.event.inputs.voice, 'My voice') && !contains(github.event.inputs.voice, 'Edge') }}
        run: pip install kokoro soundfile
      - name: Install voice-clone deps (only when "My voice" is selected)
        if: contains(github.event.inputs.voice, 'My voice')
        run: pip install chatterbox-tts peft resemble-perth
      - name: Write script + shorts (Groq, Wikipedia-grounded)
        env:
          CHANNEL: syndar
          TOPICS: ${{ github.event.inputs.topics }}
          MODE: ${{ github.event.inputs.format }}
          SHORTS: ${{ github.event.inputs.shorts_count }}
          LANGUAGE: ${{ github.event.inputs.language }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: node scripts/generate_script.mjs
      - name: Render long + shorts
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          VOICE_CHOICE: ${{ github.event.inputs.voice }}
        run: |
          case "$VOICE_CHOICE" in
            *"My voice"*) export VOICE=myvoice ;;
            *"Edge"*)     export VOICE=edge ;;
            *)            export VOICE=auto ;;
          esac
          echo "Voice engine: $VOICE"
          npm run batch -- --only=syndar
      - name: Deliver to out/ (REVIEW before upload)
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p out/syndar
          # Timestamp each delivered file so a new run never overwrites an old one (delete manually).
          TS=$(date -u +%Y%m%d-%H%M%S)
          for f in theranos-doc/out/syndar*.zip theranos-doc/out/syndar*.mp4; do
            [ -e "$f" ] || continue
            cp "$f" "out/syndar/${TS}_$(basename "$f")"
          done
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add out/syndar 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Syndar: DRAFT video + shorts — VERIFY technical claims before upload [skip ci]"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin main; then exit 0; fi
            echo "retry $i"; sleep 6
          done
