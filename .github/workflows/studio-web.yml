name: "Studio — Make from Web"

# Started by the web page (studio-web/, hosted on Vercel): the page uploads your photos/clips/voiceover
# to Vercel Blob, writes a manifest and dispatches this workflow with its (time-limited) link.
# Everything after "Fetch the project" is generated from studio-project.yml — edit that file and run
# `python studio/scripts/make_web_workflow.py`, never this one by hand.
run-name: "${{ inputs.title }} · ${{ inputs.stage }} [${{ inputs.project_id }}]"
on:
  workflow_dispatch:
    inputs:
      manifest_path:
        description: "Manifest name in the studio's storage (projects/<id>/manifest-…json) — never a link"
        required: true
        type: string
      title:
        description: "Title shown in the page's 'My videos' list"
        required: false
        type: string
        default: "web reel"
      stage:
        description: "draft | final | direct"
        required: false
        type: string
        default: "direct"
      project_id:
        description: "Web project id (for cleanup)"
        required: false
        type: string
        default: "web"

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    defaults:
      run:
        working-directory: studio
    env:
      PROJECT_DIR: projects/web-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch the project from the web page
        id: cfg
        env:
          RUNNER_KEY: ${{ secrets.RUNNER_KEY }}
          STUDIO_URL: ${{ secrets.STUDIO_URL }}
          MANIFEST_PATH: ${{ inputs.manifest_path }}
        run: python scripts/fetch_manifest.py "$MANIFEST_PATH" "$PROJECT_DIR"
      - name: Find the project files
        id: proj
        run: |
          test -d "$PROJECT_DIR" || { echo "::error::studio/$PROJECT_DIR not found — create it (see studio/projects/README.md)"; exit 1; }
          VO=$(ls "$PROJECT_DIR"/voiceover.* 2>/dev/null | head -1 || true)
          echo "voiceover=$VO" >> "$GITHUB_OUTPUT"
          echo "script=$( [ -f "$PROJECT_DIR/script.txt" ] && echo "$PROJECT_DIR/script.txt" )" >> "$GITHUB_OUTPUT"
          echo "### 📁 Project \`web-${{ github.run_id }}\`" >> "$GITHUB_STEP_SUMMARY"
          ls -la "$PROJECT_DIR" | tail -n +4 | awk '{print "- " $NF " (" $5 " bytes)"}' >> "$GITHUB_STEP_SUMMARY"
      - name: Install system libraries (headless Chrome, ffmpeg, espeak)
        if: ${{ steps.cfg.outputs.stage != 'draft' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libgbm1 \
            libasound2t64 libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 \
            libpango-1.0-0 libcairo2 libcups2 fonts-liberation fonts-noto-color-emoji espeak-ng ffmpeg
      - run: npm install --no-audit --no-fund
      - name: Install analysis + voice engines
        run: |
          pip install numpy soundfile scipy pillow "opencv-python-headless<5"
          # YuNet face detector (MIT, ~230 KB) — better than the Haar fallback; never fails the run
          mkdir -p models && curl -fsSL -o models/face_detection_yunet.onnx             https://github.com/opencv/opencv_zoo/raw/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx             || { echo "YuNet download failed — Haar fallback"; rm -f models/face_detection_yunet.onnx; }
          VOICE="${{ steps.cfg.outputs.voice }}"
          if [ -n "${{ steps.proj.outputs.voiceover }}" ] && { [ "$VOICE" = "upload" ] || [ "${{ steps.cfg.outputs.script_mode }}" = "from-voiceover" ]; }; then
            pip install faster-whisper
          fi
          if [ "$VOICE" != "upload" ] && [ "$VOICE" != "none" ] && [ "${{ steps.cfg.outputs.stage }}" != "draft" ]; then
            pip install edge-tts kokoro
            if [[ "${{ steps.cfg.outputs.language }}" = "urdu" || "$VOICE" = omnivoice* ]]; then
              pip install torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
              pip install omnivoice
            elif [[ "$VOICE" = mine* ]]; then
              pip install chatterbox-tts peft resemble-perth
            fi
          fi

      - name: ⓪ Understand your assets (subject, faces, best clip seconds)
        if: ${{ steps.cfg.outputs.stage != 'final' }}
        run: python scripts/analyze_assets.py "$PROJECT_DIR" out/analysis.json

      - name: ⓪b Transcribe your voiceover (word timings)
        if: ${{ (steps.proj.outputs.voiceover != '' && (steps.cfg.outputs.voice == 'upload' || steps.cfg.outputs.script_mode == 'from-voiceover')) && steps.cfg.outputs.stage != 'final' }}
        env:
          WHISPER_MODEL: ${{ steps.cfg.outputs.language == 'urdu' && 'medium' || 'small' }}
        run: python scripts/transcribe.py "${{ steps.proj.outputs.voiceover }}" out/transcript.json ${{ steps.cfg.outputs.language }}

      - name: ① Script + scenes (AI director)
        if: ${{ steps.cfg.outputs.stage != 'final' }}
        id: draft
        env:
          STYLE: ${{ steps.cfg.outputs.style }}
          VERBATIM: ${{ steps.cfg.outputs.script_mode == 'ai-rewrite' && 'no' || 'yes' }}
          LANGUAGE: ${{ steps.cfg.outputs.language }}
          HANDLE: ${{ steps.cfg.outputs.channel == 'cohort_zero' && '@cohort_zero' || '' }}
          THEME: ${{ steps.cfg.outputs.theme }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          GROQ_FALLBACK_MODEL: ${{ vars.GROQ_FALLBACK_MODEL }}
          GROQ_TPM: ${{ vars.GROQ_TPM }}
        run: |
          if [ "${{ steps.cfg.outputs.script_mode }}" != "from-voiceover" ] && [ -n "${{ steps.proj.outputs.script }}" ]; then
            PARAGRAPH="$(cat "${{ steps.proj.outputs.script }}")"
          elif [ -f out/transcript.json ]; then
            PARAGRAPH="$(python -c "import json;print(json.load(open('out/transcript.json',encoding='utf-8'))['text'])")"
            echo "📝 Script = what you said in your voiceover" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::No script.txt and no voiceover to transcribe in studio/$PROJECT_DIR"; exit 1
          fi
          # the director knows which assets exist, so it can write lines the photos/clips can illustrate
          export ASSET_HINTS="$(python -c "import json;print('; '.join(a['description'] for a in json.load(open('out/analysis.json',encoding='utf-8'))['assets']))")"
          PARAGRAPH="$PARAGRAPH" node scripts/draft.mjs

      - name: ② Place your assets + backgrounds, music, sound
        if: ${{ steps.cfg.outputs.stage != 'final' }}
        env:
          JOB_FILE: ${{ steps.draft.outputs.draft }}
          PROJECT_ANALYSIS: out/analysis.json
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          BG_MODE: ${{ steps.cfg.outputs.backgrounds }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          GROQ_FALLBACK_MODEL: ${{ vars.GROQ_FALLBACK_MODEL }}
          MUSIC: ${{ steps.cfg.outputs.music }}
          SFX: ${{ steps.cfg.outputs.sfx }}
          SHADERS: "off"
        run: node scripts/props.mjs "$JOB_FILE" out/props.json

      - name: ②b 2.5D — bring photos to life (never fails the run)
        if: ${{ steps.cfg.outputs.stage != 'final' }}
        continue-on-error: true
        run: |
          python -c "import torch" 2>/dev/null || pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install transformers
          python scripts/depth25d.py out/props.json

      - name: 📝 Publish the draft for the editor
        if: ${{ steps.cfg.outputs.stage == 'draft' }}
        env:
          RUNNER_KEY: ${{ secrets.RUNNER_KEY }}
          STUDIO_URL: ${{ secrets.STUDIO_URL }}
          DRAFT_SETTINGS: ${{ steps.cfg.outputs.settings_json }}
        run: |
          npm install --prefix ../studio-web --no-audit --no-fund --silent
          node ../studio-web/tools/blob_sync.mjs push "${{ steps.cfg.outputs.project_id }}" out/props.json public

      - name: 📥 Pull your edited draft
        if: ${{ steps.cfg.outputs.stage == 'final' }}
        env:
          RUNNER_KEY: ${{ secrets.RUNNER_KEY }}
          STUDIO_URL: ${{ secrets.STUDIO_URL }}
        run: |
          npm install --prefix ../studio-web --no-audit --no-fund --silent
          node ../studio-web/tools/blob_sync.mjs pull "${{ steps.cfg.outputs.project_id }}" out/props.json public

      - name: Voice lines from earlier runs of this project (line-by-line regeneration)
        if: ${{ steps.cfg.outputs.stage != 'draft' }}
        uses: actions/cache@v4
        with:
          path: studio/out/voicecache
          key: voice-${{ steps.cfg.outputs.project_id }}-${{ github.run_id }}
          restore-keys: voice-${{ steps.cfg.outputs.project_id }}-
      - name: 🗣️ Voice lines from an earlier video with the same script
        if: ${{ steps.cfg.outputs.stage != 'final' }}
        uses: actions/cache@v4
        with:
          path: studio/out/voicecache
          key: voicetxt-${{ steps.cfg.outputs.script_key }}-${{ github.run_id }}
          restore-keys: voicetxt-${{ steps.cfg.outputs.script_key }}-

      - name: ③ Narration (your voiceover, aligned — or a voice)
        if: ${{ steps.cfg.outputs.stage != 'draft' }}
        env:
          VOICE: ${{ steps.cfg.outputs.voice }}
          LANGUAGE: ${{ steps.cfg.outputs.language }}
          PACE: ${{ steps.cfg.outputs.pace }}
          VOICEOVER: ${{ steps.proj.outputs.voiceover }}
          TRANSCRIPT: out/transcript.json
          VOICE_CACHE: out/voicecache
        run: python scripts/narrate.py out/props.json

      - name: ③b Fit the music to the story (drop on the reveal, ends on the beat)
        if: ${{ steps.cfg.outputs.stage != 'draft' }}
        continue-on-error: true
        run: python scripts/music_apply.py out/props.json

      - name: ④ Render the reel
        if: ${{ steps.cfg.outputs.stage != 'draft' }}
        # a FIRST render is ~3x faster as one normal render than scene-by-scene (23 scenes: ~7 vs ~21 min);
        # the scene cache only pays off for re-renders after edits
        env:
          ENGINE: ${{ steps.cfg.outputs.engine || 'classic' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          GROQ_FALLBACK_MODEL: ${{ vars.GROQ_FALLBACK_MODEL }}
          GROQ_TPM: ${{ vars.GROQ_TPM }}
        run: |
          if [ "$ENGINE" = "cue" ]; then
            echo "🧩 CUE engine: the free LLM writes the program, our compiler solves layout, timing and motion" | tee -a "$GITHUB_STEP_SUMMARY"
            node vc/pipeline.mjs out/props.json out/cue_props.json
            npx remotion render Cue out/reel.mp4 --props=out/cue_props.json --concurrency=2 --log=info
            test -s out/reel.mp4 || { echo "::error::the render produced no video"; exit 1; }
            npx remotion still Cue out/poster.jpg --props=out/cue_props.json --frame=45 || true
          else
            npx remotion render Reel out/reel.mp4 --props=out/props.json --concurrency=2 --log=info
            test -s out/reel.mp4 || { echo "::error::the render produced no video"; exit 1; }
            npx remotion still Reel out/poster.jpg --props=out/props.json --frame=20 || true
          fi

      - name: ⑤ Self-check — watch the render, fix the edit, render again
        if: ${{ ((steps.cfg.outputs.engine || 'classic') != 'cue') && steps.cfg.outputs.stage != 'draft' }}
        run: |
          set +e
          python scripts/critic.py out/reel.mp4 out/props.json out/critic1.json --apply
          code=$?
          set -e
          if [ "$code" = "3" ]; then
            echo "↻ scene fixes applied — re-rendering only the changed scenes" | tee -a "$GITHUB_STEP_SUMMARY"
            cp out/reel.mp4 out/reel_first.mp4
            npx remotion render Reel out/reel.mp4 --props=out/props.json --concurrency=2 --log=error && test -s out/reel.mp4 || { echo "::warning::re-render failed — keeping the first render"; cp out/reel_first.mp4 out/reel.mp4; }
            python scripts/critic.py out/reel.mp4 out/props.json out/critic2.json --apply || true
          elif [ "$code" != "0" ]; then
            echo "::warning::self-check crashed (exit $code) — keeping the first render"
          fi

      - name: ⑥ Caption file
        if: ${{ steps.cfg.outputs.stage != 'draft' }}
        run: |
          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("out/props.json", "utf8")).job;
            const lines = [p.title || "", "", p.caption || ""];
            const img = (p.credits || []).filter((c) => c.beat !== "music" && !/Pexels/i.test(c.license || ""));
            if (img.length) lines.push("", "Images: " + img.map((c) => `${c.title} — ${c.artist} (${c.license})`).join("; "));
            if (p.hooks && p.hooks.length) lines.push("", "--- alternative hooks ---", ...p.hooks);
            fs.writeFileSync("out/caption.txt", lines.join("\n").trim() + "\n");
          '

      - name: Deliver
        if: ${{ steps.cfg.outputs.stage != 'draft' }}
        uses: actions/upload-artifact@v4
        with:
          name: studio-project-run${{ github.run_number }}
          path: |
            studio/out/reel.mp4
            studio/out/poster.jpg
            studio/out/caption.txt
            studio/out/*.json
          retention-days: 30
          if-no-files-found: warn

      - name: 📱 Phone link
        if: ${{ steps.cfg.outputs.stage != 'draft' }}
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_FILE: ${{ steps.draft.outputs.draft }}
        run: PHONE_NAME="web-${{ github.run_id }}" bash scripts/phone_link.sh web

      - name: Save the draft
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add studio/src/data/drafts/ 2>/dev/null || true
          git commit -m "studio: project draft ${{ steps.draft.outputs.draft }} [skip ci]" || { echo "nothing to commit"; exit 0; }
          git pull --rebase --autostash || true
          git push || echo "push skipped"
