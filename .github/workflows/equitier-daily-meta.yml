name: "Equitier — Daily Reels → Instagram + Facebook (2/day)"

# Dedicated Meta pipeline, SEPARATE from YouTube: the scout picks a trending finance topic, the
# machine builds ONE reel in YOUR cloned voice, and posts it to the Equitier Facebook Page AND
# Instagram. Runs twice a day (two spaced schedules) = 2 reels/day. Topic dedup (channels/history)
# keeps the two daily reels on different topics. No YouTube upload here.
on:
  schedule:
    - cron: "0 13 * * *" # ~09:00 US-Eastern (morning slot)
    - cron: "0 21 * * *" # ~17:00 US-Eastern (evening slot)
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional topic (leave blank to auto-pick a trending one)"
        required: false
        type: string

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    defaults:
      run:
        working-directory: theranos-doc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: theranos-doc/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install headless-Chrome libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libgbm1 \
            libasound2t64 libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 \
            libpango-1.0-0 libcairo2 libcups2 fonts-liberation fonts-noto-color-emoji espeak-ng
      - run: npm ci
      - run: pip install edge-tts soundfile chatterbox-tts peft resemble-perth
      - name: Pick a trending topic (scout)
        id: scout
        run: |
          TOPIC="${{ github.event.inputs.topic }}"
          if [ -z "$TOPIC" ]; then TOPIC="$(node scripts/scout.mjs --channel=equitier --one)"; fi
          echo "Chosen topic: $TOPIC"
          echo "topic=$TOPIC" >> "$GITHUB_OUTPUT"
      - name: Write reel (Groq)
        env:
          CHANNEL: equitier
          TOPICS: ${{ steps.scout.outputs.topic }}
          MODE: shorts
          SHORTS: "1"
          LANGUAGE: English
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: node scripts/generate_script.mjs
      - name: Persist topic history (so the next reel won't repeat)
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add channels/history/*.json 2>/dev/null || true
          git commit -m "chore(history): equitier meta reel [skip ci]" || { echo "no history change"; exit 0; }
          git pull --rebase --autostash || true
          git push || echo "push skipped"
      - name: Render (your cloned voice) + post to Instagram + Facebook
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          VOICE: myvoice
          # No YouTube here — this pipeline is Meta-only.
          META_UPLOAD: "1"
          META_PAGE_ID_EQUITIER: ${{ vars.META_PAGE_ID_EQUITIER }}
          META_IG_USER_ID_EQUITIER: ${{ vars.META_IG_USER_ID_EQUITIER }}
          META_PAGE_TOKEN_EQUITIER: ${{ secrets.META_PAGE_TOKEN_EQUITIER }}
          # Hosts the reel on a GitHub Release so Meta can fetch it by URL.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run batch -- --only=equitier
      - name: Deliver as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: equitier-meta-run${{ github.run_number }}
          path: theranos-doc/out/equitier*.zip
          retention-days: 30
          if-no-files-found: warn
