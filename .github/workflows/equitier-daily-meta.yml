name: "Equitier — Daily Market Analysis → Instagram + Facebook"

# Advanced market-analysis reels, SEPARATE from YouTube. Two runs a day, ~1 hour apart (morning PKT):
#   Weekdays  : run 1 = GOLD, run 2 = BITCOIN — real candlestick charts + pro-trader analysis.
#   Weekends  : markets closed → both runs auto-switch to a mature US-stock DEEP-DIVE (dedup'd).
# Real data + charts only (no stock/AI images). Kokoro voice. Posts to the Equitier FB Page + Instagram.
on:
  schedule:
    - cron: "0 3 * * *" # 08:00 PKT — GOLD (or weekend deep-dive #1)
    - cron: "0 4 * * *" # 09:00 PKT — BITCOIN (or weekend deep-dive #2)  (~1h gap)
  workflow_dispatch:
    inputs:
      asset:
        description: "Which reel to build"
        type: choice
        options: [gold, btc, deepdive]
        default: gold
        required: false
      publish:
        description: "publish = post to FB+IG · test = render only, NO upload (download the zip to watch)"
        type: choice
        options: [publish, test]
        default: publish
        required: false
      story:
        description: "Also drop the reel to your Instagram Story (the 'new post' teaser)"
        type: choice
        options: [on, off]
        default: on
        required: false
      carousel:
        description: "Also post the chart CAROUSEL to Instagram (saveable 'today's levels')"
        type: choice
        options: [on, off]
        default: on
        required: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    defaults:
      run:
        working-directory: theranos-doc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: theranos-doc/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install headless-Chrome libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libgbm1 \
            libasound2t64 libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 \
            libpango-1.0-0 libcairo2 libcups2 fonts-liberation fonts-noto-color-emoji espeak-ng
      - run: npm ci
      - run: pip install edge-tts soundfile kokoro
      - name: Choose asset (by schedule slot, or manual input)
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "0 3 * * *" ]; then ASSET=gold; else ASSET=btc; fi
          else
            ASSET="${{ github.event.inputs.asset }}"; ASSET="${ASSET:-gold}"
          fi
          MODE=""; if [ "$ASSET" = "deepdive" ]; then MODE=deepdive; fi
          # Publish unless this is a manual "test" run (scheduled runs always publish).
          UPLOAD=1
          if [ "${{ github.event_name }}" != "schedule" ] && [ "${{ github.event.inputs.publish }}" = "test" ]; then UPLOAD=0; fi
          # Story on by default; off if the run is a test (no upload) or the dropdown says off.
          STORY=1
          if [ "$UPLOAD" = "0" ] || [ "${{ github.event.inputs.story }}" = "off" ]; then STORY=0; fi
          CAROUSEL=1
          if [ "$UPLOAD" = "0" ] || [ "${{ github.event.inputs.carousel }}" = "off" ]; then CAROUSEL=0; fi
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "upload=$UPLOAD" >> "$GITHUB_OUTPUT"
          echo "story=$STORY" >> "$GITHUB_OUTPUT"
          echo "carousel=$CAROUSEL" >> "$GITHUB_OUTPUT"
          echo "Asset: $ASSET  Mode: ${MODE:-auto}  Upload: $UPLOAD  Story: $STORY  Carousel: $CAROUSEL"
      - name: Build the analysis reel (real data + charts + Groq narration)
        env:
          CHANNEL: equitier
          ASSET: ${{ steps.pick.outputs.asset }}
          MODE: ${{ steps.pick.outputs.mode }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
        run: node scripts/analysis_reel.mjs
      - name: Persist history (weekend deep-dive dedup)
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add channels/history/*.json 2>/dev/null || true
          git commit -m "chore(history): equitier analysis reel [skip ci]" || { echo "no history change"; exit 0; }
          git pull --rebase --autostash || true
          git push || echo "push skipped"
      - name: Render (Kokoro voice) + post to Instagram + Facebook
        env:
          VOICE: kokoro
          # Meta-only — no YouTube here. "1" to post, "0" for a test render (set by the dropdown).
          META_UPLOAD: ${{ steps.pick.outputs.upload }}
          META_STORY: ${{ steps.pick.outputs.story }}
          META_CAROUSEL: ${{ steps.pick.outputs.carousel }}
          META_PAGE_ID_EQUITIER: ${{ vars.META_PAGE_ID_EQUITIER || secrets.META_PAGE_ID_EQUITIER }}
          META_IG_USER_ID_EQUITIER: ${{ vars.META_IG_USER_ID_EQUITIER || secrets.META_IG_USER_ID_EQUITIER }}
          META_PAGE_TOKEN_EQUITIER: ${{ secrets.META_PAGE_TOKEN_EQUITIER }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run batch -- --only=equitier
      - name: Deliver as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: equitier-analysis-run${{ github.run_number }}
          path: theranos-doc/out/equitier*.zip
          retention-days: 30
          if-no-files-found: warn
