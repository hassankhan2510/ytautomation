name: "Studio — Voice test (OmniVoice on CPU)"

# Feasibility check: does OmniVoice (Urdu + English voice cloning) run on a free CPU runner, and how fast?
# Download the artifact to hear the clips; the run summary shows the speed.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install CPU PyTorch + OmniVoice
        run: |
          pip install torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install omnivoice soundfile
      - name: Clone voice + time it
        run: python scripts/omnivoice_cpu_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: omnivoice-cpu-test-run${{ github.run_number }}
          path: studio/out/voicetest/*.wav
          retention-days: 14
