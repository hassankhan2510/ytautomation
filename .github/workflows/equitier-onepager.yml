name: "Equitier — Daily Insight + Quote Reels → Instagram"

# TWO shareable one-page reels a day — a market-PSYCHOLOGY insight (names a trap people recognize in
# themselves) + a wealth-mindset QUOTE — built to be reposted and sent to a friend, in the creator
# style with a relevant AI background. Posted to Equitier's Instagram feed AND Story. Separate from the
# weekly per-asset analysis (equitier-daily-meta). Posts only if META_*_EQUITIER secrets are set.
on:
  schedule:
    - cron: "20 6 * * *"  # morning — INSIGHT (market psychology)
    - cron: "20 14 * * *" # afternoon — QUOTE (wealth mindset)
  workflow_dispatch:
    inputs:
      mode:
        description: "lesson = market-psychology insight · quote = wealth-mindset quote"
        type: choice
        options: [lesson, quote]
        default: lesson
        required: false
      publish:
        description: "publish = post to Instagram · test = render only (download the artifact)"
        type: choice
        options: [publish, test]
        default: publish
        required: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        working-directory: theranos-doc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: theranos-doc/package-lock.json
      - name: Install headless-Chrome libraries (for the Remotion render)
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libgbm1 \
            libasound2t64 libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 \
            libpango-1.0-0 libcairo2 libcups2 fonts-liberation fonts-noto-color-emoji
      - run: npm ci
      - name: Decide mode (morning=insight, afternoon=quote; or manual input)
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "20 14 * * *" ]; then MODE=quote; else MODE=lesson; fi
          else
            MODE="${{ github.event.inputs.mode }}"; MODE="${MODE:-lesson}"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Mode: $MODE"
      - name: Write the card (Groq, de-duped)
        env:
          CHANNEL: equitier
          ONEPAGER_MODE: ${{ steps.mode.outputs.mode }}
          ONEPAGER_AVATAR: ${{ vars.ONEPAGER_AVATAR_EQUITIER }}
          ONEPAGER_NAME: ${{ vars.ONEPAGER_NAME_EQUITIER }}
          ONEPAGER_AT: ${{ vars.ONEPAGER_AT_EQUITIER }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          GROQ_FALLBACK_MODEL: ${{ vars.GROQ_FALLBACK_MODEL }}
          GROQ_TPM: ${{ vars.GROQ_TPM }}
        run: node scripts/gen_onepager.mjs
      - name: Persist history (so quotes never repeat)
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add channels/history/*.json 2>/dev/null || true
          git commit -m "chore(history): equitier quote reel [skip ci]" || { echo "no history change"; exit 0; }
          git pull --rebase --autostash || true
          git push || echo "push skipped"
      - name: Stub timeline.json so the bundler resolves (it's gitignored; OnePager doesn't use it)
        run: |
          if [ ! -f src/data/timeline.json ]; then
            echo '{"fps":30,"totalDurationInFrames":1,"accentColor":"#10b981"}' > src/data/timeline.json
            echo "wrote stub src/data/timeline.json"
          fi
      - name: Render the reel (OnePager, 9:16)
        run: npx remotion render OnePager out/equitier_onepager.mp4 --props=out/onepager_props.json --concurrency=2
      - name: Post to Instagram (no-op unless Meta secrets are set / test run)
        if: ${{ github.event.inputs.publish != 'test' }}
        env:
          META_TARGETS: "ig"
          META_STORY: "1"
          META_PAGE_ID_EQUITIER: ${{ vars.META_PAGE_ID_EQUITIER || secrets.META_PAGE_ID_EQUITIER }}
          META_IG_USER_ID_EQUITIER: ${{ vars.META_IG_USER_ID_EQUITIER || secrets.META_IG_USER_ID_EQUITIER }}
          META_PAGE_TOKEN_EQUITIER: ${{ secrets.META_PAGE_TOKEN_EQUITIER }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/meta_upload.mjs --channel=equitier --video=out/equitier_onepager.mp4 --script=jobs/equitier_onepager.json
      - name: Cross-post to LinkedIn via Buffer (no-op without BUFFER_ACCESS_TOKEN)
        if: ${{ github.event.inputs.publish != 'test' }}
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_CHANNEL_ID_EQUITIER: ${{ vars.BUFFER_CHANNEL_ID_EQUITIER }}
        run: node scripts/buffer_post.mjs --channel=equitier --props=out/onepager_props.json --script=jobs/equitier_onepager.json
      - name: Deliver as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: equitier-quote-run${{ github.run_number }}
          path: |
            theranos-doc/out/equitier_onepager.mp4
            theranos-doc/out/onepager_props.json
          retention-days: 30
          if-no-files-found: warn
