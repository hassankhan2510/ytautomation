name: Batch Render

# Renders EVERY jobs/*.json in parallel (one runner each). Trigger from the Actions
# tab. Each finished video appears as its own artifact. Laptop can be off.
on:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.list.outputs.jobs }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        working-directory: theranos-doc
        run: |
          names=$(ls jobs/*.json 2>/dev/null | xargs -n1 basename | sed 's/\.json$//' \
            | jq -R -s -c 'split("\n") | map(select(length>0))')
          echo "jobs=$names" >> "$GITHUB_OUTPUT"
          echo "Found jobs: $names"

  render:
    needs: discover
    if: ${{ needs.discover.outputs.jobs != '[]' && needs.discover.outputs.jobs != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        name: ${{ fromJSON(needs.discover.outputs.jobs) }}
    defaults:
      run:
        working-directory: theranos-doc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: theranos-doc/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install headless-Chrome system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libgbm1 \
            libasound2t64 libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 \
            libxdamage1 libpango-1.0-0 libcairo2 libcups2 \
            fonts-liberation fonts-noto-color-emoji
      - run: npm ci
      - run: pip install edge-tts
      - name: Swap in job "${{ matrix.name }}"
        run: |
          cp "jobs/${{ matrix.name }}.json" src/data/script.json
          if [ -f "jobs/${{ matrix.name }}.research.md" ]; then
            cp "jobs/${{ matrix.name }}.research.md" src/data/research.md
          fi
      - name: Prepare (validate -> voiceover -> assets -> compress)
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: npm run prepare-video
      - name: Render
        run: |
          PLATFORM=$(node -p "require('./jobs/${{ matrix.name }}.json').meta.platform || 'youtube-long'")
          case "$PLATFORM" in
            shorts|reel) COMP=Shorts ;;
            linkedin)    COMP=Square ;;
            *)           COMP=YouTube ;;
          esac
          echo "Rendering ${{ matrix.name }} as $COMP ($PLATFORM)"
          npx remotion render "$COMP" "out/${{ matrix.name }}.mp4" --concurrency=2
      - uses: actions/upload-artifact@v4
        with:
          name: video-${{ matrix.name }}
          path: theranos-doc/out/${{ matrix.name }}.mp4
          retention-days: 7

  # Gather every rendered video and commit them into the repo's out/ folder,
  # so you can grab them from GitHub on any device (no artifacts, no tokens).
  collect:
    needs: render
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: _artifacts
      - name: Move videos into out/
        run: |
          mkdir -p out
          find _artifacts -name '*.mp4' -exec cp {} out/ \; 2>/dev/null || true
          rm -rf _artifacts
          echo "Videos ready:" && ls -la out || true
      - name: Commit videos to repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add out/*.mp4 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No videos to commit."; exit 0
          fi
          git commit -m "Add rendered videos [skip ci]"
          # Retry against concurrent pushes (code commits may move main meanwhile).
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin main; then
              echo "Pushed."; exit 0
            fi
            echo "Push race, retry $i..."; sleep 6
          done
          echo "Could not push videos after retries."; exit 1
